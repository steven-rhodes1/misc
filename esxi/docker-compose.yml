services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ChangeMeNow!
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  redfish-exporter:
    image: ghcr.io/e-breuninger/redfish-exporter:latest
    container_name: redfish-exporter
    restart: unless-stopped
    volumes:
      - ./redfish.yml:/etc/redfish-exporter/config.yml:ro
    ports:
      - "9610:9610"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-vcenter
    restart: unless-stopped
    volumes:
      - ./otel-vcenter.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "8889:8889"

volumes:
  prometheus_data:
  grafana_data:
